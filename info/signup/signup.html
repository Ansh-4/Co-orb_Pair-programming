<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="line-background">

    <svg viewBox="0 0 1200 800">

        <path d="M-200 150 C100 50 300 250 600 150 S1000 50 1400 180"></path>

        <path d="M-300 350 C0 250 300 450 600 350 S1000 250 1500 400"></path>

        <path d="M-200 550 C100 450 350 650 650 550 S1050 450 1400 600"></path>

        <path d="M-300 750 C0 650 300 850 600 750 S1000 650 1500 800"></path>

    </svg>

</div>

    <div class="signup-container">

        <div class="signup-card">

            <div class="logo">Co-orb</div>

            <h1>Create your account</h1>
            <p class="subtitle">Start building something amazing today.</p>

            <form>

                <div class="name-row">
                    <div class="input-group">
                        <label>First name</label>
                        <input type="text" placeholder="John">
                    </div>

                    <div class="input-group">
                        <label>Last name</label>
                        <input type="text" placeholder="Doe">
                    </div>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="you@example.com">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password">
                </div>

                <div class="terms">
                    <input type="checkbox">
                    <span>I agree to the Terms and Privacy Policy</span>
                </div>

                <button type="submit">Create account</button>

            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <button class="google-btn">
                Continue with Google
            </button>

            <p class="login">
                Already have an account?
                <a href="../login/login.html">Log in</a>
            </p>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/animejs/lib/anime.iife.min.js"></script>
    <script src="signup.js"></script> 

</body>
</html>
